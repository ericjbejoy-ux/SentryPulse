<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SentryBank — demo victim site</title>
<style>
  body { font-family: monospace; background: #05070a; color: #e2e8f0; margin: 0; padding: 32px 16px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; letter-spacing: 3px; margin: 0 0 4px; }
  .sub { color: #64748b; font-size: 12px; margin-bottom: 24px; }
  .card { background: #090d14; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .bal { font-size: 34px; font-weight: bold; color: #10b981; }
  .lights { display: flex; gap: 12px; }
  .light { flex: 1; text-align: center; padding: 12px 6px; border-radius: 8px; border: 1px solid #1e293b; font-size: 11px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; margin: 0 auto 8px; }
  .ok { background: #10b981; box-shadow: 0 0 10px #10b981; }
  .bad { background: #f43f5e; box-shadow: 0 0 10px #f43f5e; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }
  button { background: #059669; color: #04120c; font: bold 14px monospace; border: 0; border-radius: 8px; padding: 12px 24px; cursor: pointer; }
  button:disabled { opacity: 0.5; }
  #msg { min-height: 20px; margin-top: 12px; font-size: 12px; }
  .good { color: #10b981; } .err { color: #f43f5e; }
  .note { color: #475569; font-size: 11px; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏦 SENTRYBANK</h1>
  <div class="sub">demo victim site — every rupee flows gateway → api → ledger</div>

  <div class="card">
    <div style="font-size:11px;color:#64748b">ALICE BALANCE</div>
    <div class="bal">₹<span id="bal">…</span></div>
    <div style="margin-top:16px">
      <button id="pay" onclick="doPay()">Pay ₹10</button>
    </div>
    <div id="msg"></div>
  </div>

  <div class="card">
    <div style="font-size:11px;color:#64748b;margin-bottom:12px">SERVICE HEALTH</div>
    <div class="lights" id="lights"></div>
    <div id="banner" style="display:none;margin-top:12px;padding:10px;border-radius:8px;background:#450a0a;border:1px solid #7f1d1d;color:#fca5a5;font-size:12px"></div>
  </div>

  <div class="note">Watched by SentryPulse (:5173). Break me from the ☠️ Crash-test bar, fix me with EXECUTE CURE.</div>
</div>
<script>
async function refresh() {
  try {
    const s = await (await fetch('/status')).json();
    document.getElementById('banner').style.display = 'none';
    document.getElementById('lights').innerHTML = s.services.map(v =>
      `<div class="light"><div class="dot ${v.status === 'ok' ? 'ok' : 'bad'}"></div><b>${v.svc}</b><br>:${v.port}<br>${v.status}</div>`
    ).join('');
  } catch {
    // Gateway itself is down: this page is served by the gateway, so show
    // the outage honestly instead of freezing on stale green lights.
    document.getElementById('lights').innerHTML = ['gateway', 'api', 'db'].map(svc =>
      `<div class="light"><div class="dot bad"></div><b>${svc}</b><br>down</div>`
    ).join('');
    const banner = document.getElementById('banner');
    banner.style.display = 'block';
    banner.textContent = '🔴 Gateway unreachable — this page is served by the gateway itself. Revive it from the SentryPulse control room (:5173).';
  }
  try {
    const a = await (await fetch('/account?acct=alice')).json();
    if (a.ok) document.getElementById('bal').textContent = Number(a.balance).toFixed(2);
  } catch { /* ignore */ }
}
async function doPay() {
  const btn = document.getElementById('pay'), msg = document.getElementById('msg');
  btn.disabled = true;
  try {
    const r = await (await fetch('/pay', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({acct: 'alice', amount: 10})
    })).json();
    if (r.ok) {
      msg.innerHTML = `<span class="good">✅ Paid ₹10 — balance ₹${Number(r.balance).toFixed(2)}</span>`;
      document.getElementById('bal').textContent = Number(r.balance).toFixed(2);
    } else {
      msg.innerHTML = `<span class="err">❌ Payment failed: ${r.error}</span>`;
    }
  } catch (e) {
    msg.innerHTML = `<span class="err">❌ Gateway unreachable: ${e.message}</span>`;
  }
  btn.disabled = false;
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
